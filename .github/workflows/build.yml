name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 装前端依赖
        run: npm ci

      - name: 类型检查 + 构建前端
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          # workspace 根在仓库根，产物默认进 target/
          workspaces: ". -> target"

      - name: 核心库单测
        run: cargo test -p dlp-core --lib

      - name: 构建 exe 与安装程序
        # tauri-cli 会把 exe 改成 productName 并把 NSIS 安装包放进 bundle/nsis
        run: npx tauri build

      - name: 整理产物
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本: $version"

          # MSVC 下 WebView2Loader 是静态链接的（webview2-com-sys 的 cfg_attr），
          # 所以这个 exe 单独放哪都能跑，不用带 dll
          # 设了 mainBinaryName 之后，tauri build 会把 exe 改成那个名字（不设就是 cargo 包名）
          $bin = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).mainBinaryName
          if (-not $bin) { $bin = "dlp-desktop" }
          $exe = "target/release/$bin.exe"
          Write-Host "产物: $exe"
          if (-not (Test-Path $exe)) { throw "没找到 $exe" }

          Copy-Item $exe "DLP-$version.exe"
          Get-Item "DLP-$version.exe" | Select-Object Name, Length | Format-Table | Out-String

          $setup = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "DLP-$version-setup.exe"
            Get-Item "DLP-$version-setup.exe" | Select-Object Name, Length | Format-Table | Out-String
          } else {
            # NSIS 要在构建时联网下（tauri 从 github.com/tauri-apps/binary-releases 拉），
            # 拉不到就只发 exe，不让整个构建挂掉
            Write-Warning "没生成 NSIS 安装包（大概是下载 NSIS 工具链失败），这次只发 exe"
          }

          "DLP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 上传构建产物（每次都能下）
        uses: actions/upload-artifact@v4
        with:
          name: dlp-${{ steps.meta.outputs.version }}-win64
          path: DLP-${{ env.DLP_VERSION }}*.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DLP-${{ env.DLP_VERSION }}.exe
            DLP-${{ env.DLP_VERSION }}-setup.exe
          # tag 里带 beta / alpha 就标成预发布
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_files: true

  # 单独跑、允许失败：把「这个 exe 在 Win7 上缺哪些系统 DLL」记录下来。
  # 结论进 job summary，不拦构建 —— 缺不缺 DLL 取决于 tauri/rust 的版本，
  # 不是每次提交能改的东西。
  win7-check:
    name: Windows 7 兼容性检查
    runs-on: windows-latest
    needs: windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 取本次构建的 exe
        uses: actions/download-artifact@v4
        with:
          name: dlp-${{ needs.windows.outputs.version }}-win64
          path: artifacts

      - name: 分析导入表
        shell: pwsh
        run: |
          $exe = Get-ChildItem artifacts -Filter *.exe | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
          if (-not $exe) { throw "没找到 exe" }
          Write-Host "分析 $($exe.Name)"
          # 脚本自己会打印分类结果；退出码 2 = Win7 上有硬阻断
          $out = node scripts/pe-imports.mjs $exe.FullName --win7 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          @("### Windows 7 兼容性", "", '```', $out, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -eq 2) {
            Write-Warning "这个 exe 在 Windows 7 上跑不起来（上面列了缺的 DLL）。Tauri 2 官方最低要求 Windows 10。"
          }
