[package]
name = "dlp-desktop"
version = "0.4.0"
description = "Dream Launchpad Launcher - desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77"

# 桌面端只需 rlib：cdylib 会让 Windows 导出序号超出 65535 而链接失败
[lib]
name = "dlp_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dlp-core = { path = "../src" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

