[package]
name = "dlp-desktop"
version = "1.0.0-beta.2"
description = "Dream Launchpad Launcher - desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77"

# 桌面端只需 rlib：cdylib 会让 Windows 导出序号超出 65535 而链接失败
[lib]
name = "dlp_desktop_lib"
crate-type = ["rlib"]

[features]
# 生产构建必须打开：不带这个 feature，Tauri 认为自己在 dev 模式，
# 不把前端资源嵌进 exe，运行时去找 devUrl（localhost:1420）就会白屏
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

dlp-core = { path = "../src" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

