[package]
name = "dlp-core"
version = "0.17.0"
description = "Dream Launchpad Launcher 核心逻辑（无 GUI 依赖，可独立测试）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dlp_core"
path = "lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
futures-util = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
